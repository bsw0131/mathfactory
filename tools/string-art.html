<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스트링아트 도안 | 수학창의공작소</title>
  <meta name="description" content="점과 번호로 바로 출력할 수 있는 스트링아트 도안 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="string-art.css" />
</head>
<body class="string-art-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="수학창의공작소 홈">
        <span class="brand-mark">Σ</span>
        <span class="brand-text">
          <strong>수학창의공작소</strong>
          <em>by math chef</em>
        </span>
      </a>
      <nav class="nav" aria-label="주요 메뉴">
        <a href="../index.html#home">홈</a>
        <a href="../index.html#math-tools" class="active">수학수업도움</a>
        <a href="../index.html#school-tools">학교업무도움</a>
        <a href="../index.html#about">소개</a>
      </nav>
    </div>
  </header>

  <main class="string-art-main">
    <section class="string-hero container">
      <a class="back-link" href="../index.html#math-tools">수학수업도움으로 돌아가기</a>
      <p class="eyebrow">STRING ART TEMPLATE</p>
      <h2>점과 번호로 만드는<br><span>스트링아트 도안 5종</span></h2>
      <p class="string-intro">원형, 격자, 하트, 별, 나선형 도안을 바로 미리보고 수업 자료로 출력할 수 있습니다.</p>
    </section>

    <section class="string-workspace container" aria-label="스트링아트 도안 작업 영역">
      <aside class="template-panel">
        <div class="panel-title-row">
          <span class="step-badge">1</span>
          <div>
            <h3>도안 선택</h3>
            <p>수업 주제에 맞는 형태를 고르세요.</p>
          </div>
        </div>

        <div class="template-list" id="templateList" aria-label="도안 목록"></div>

        <div class="option-panel">
          <h3>표시 옵션</h3>
          <label class="toggle-row">
            <input type="checkbox" id="showGuide" checked>
            <span>가이드 선</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="showThreads">
            <span>실 연결선</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="showNumbers" checked>
            <span>점 번호</span>
          </label>
          <label class="toggle-row">
            <input type="checkbox" id="showCenter" checked>
            <span>중심점</span>
          </label>
        </div>
      </aside>

      <section class="preview-panel">
        <div class="preview-head">
          <div>
            <span class="preview-kicker">선택한 도안</span>
            <h3 id="templateTitle">원형 도안</h3>
          </div>
          <div class="button-row">
            <button class="action-btn secondary" id="downloadSvgBtn">SVG 다운로드</button>
            <button class="action-btn" id="printBtn">인쇄하기</button>
          </div>
        </div>

        <div class="art-board" id="artBoard" aria-live="polite"></div>

        <div class="template-meta" id="templateMeta"></div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner compact-footer">
      <p>© 2026 수학창의공작소. Built with GitHub Pages.</p>
      <div class="footer-links">
        <a href="../index.html#math-tools">수학수업도움</a>
        <a href="../index.html#about">소개</a>
      </div>
    </div>
  </footer>

  <script src="string-art.js"></script>
</body>
</html>
